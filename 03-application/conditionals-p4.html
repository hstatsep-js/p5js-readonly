<html>
    <head>
        <!-- Required meta tags -->
        <meta charset="utf-8">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
        <style>

        <title>Title</title>

    <body>
        <!-- HTML -->
        
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
        <script>
            // JS

            var x; // position
            var xSpeed; // velocity
            
            function setup() {
                createCanvas(800, 600);
                x = width/2;
                xSpeed = 5;
                // frameRate(20);
            }

            function draw() {
                background(220);

                ellipse(x,height/2,50);
                x += xSpeed;
                console.log(x)

                // if(x >= width-25){ // past right edge
                //     x = 0; // reset position
                // }
                // if(x >= width-25){ // past right edge
                //     xSpeed = -5; // bounce off right edge
                // }
                // if(x <= 25){ // past left edge
                //     xSpeed = 5; // bounce off left edge
                // }
                if(x >= width-25 || x <= 25){ // past either edge
                    // reverse direction (bounce)
                    xSpeed *= -1;
                }
            }
            
        </script>
    </body>
